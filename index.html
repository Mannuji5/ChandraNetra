<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zero-DCE Image Enhancer</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --panel-bg: #1e293b;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 40px 20px;
            text-align: center;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background-color: var(--panel-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        h1 { margin-top: 0; font-size: 28px; }
        p.subtitle { color: var(--text-muted); margin-bottom: 30px; }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
            margin-bottom: 30px;
        }

        input[type="file"] {
            background: rgba(255, 255, 255, 0.05);
            padding: 10px;
            border-radius: 6px;
            border: 1px dashed var(--text-muted);
            cursor: pointer;
        }

        .slider-container {
            width: 100%;
            max-width: 400px;
        }

        input[type="range"] { width: 100%; margin-top: 10px; }

        button {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover { background-color: var(--accent-hover); }
        button:disabled { background-color: var(--text-muted); cursor: not-allowed; }

        .gallery {
            display: flex;
            gap: 20px;
            margin-top: 20px;
        }

        .image-box {
            flex: 1;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            padding: 15px;
            min-height: 250px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .image-box img {
            max-width: 100%;
            max-height: 400px;
            border-radius: 6px;
            display: none;
            margin-top: 10px;
        }

        #status {
            margin-top: 15px;
            font-weight: 500;
            color: #fbbf24;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🌙 Zero-DCE Image Enhancer</h1>
        <p class="subtitle">Upload a low-light photograph to brighten it using GPU-accelerated deep learning.</p>

        <div class="controls">
            <input type="file" id="image-input" accept="image/png, image/jpeg">
            
            <div class="slider-container">
                <label for="blend-slider">Enhancement Strength: <span id="slider-value">0.6</span></label>
                <input type="range" id="blend-slider" min="0" max="1" step="0.05" value="0.6">
            </div>

            <button id="enhance-btn">Enhance Image</button>
            <div id="status"></div>
        </div>

        <div class="gallery">
            <div class="image-box">
                <h3>Original</h3>
                <img id="original-preview" alt="Original Image">
            </div>
            <div class="image-box">
                <h3>Enhanced</h3>
                <img id="enhanced-output" alt="Enhanced Image">
            </div>
        </div>
    </div>

    <!-- Import the Gradio Client via CDN for static hosting compatibility -->
    <script type="module">
        import { client } from "https://cdn.jsdelivr.net/npm/@gradio/client/dist/index.min.js";

        const imageInput = document.getElementById('image-input');
        const blendSlider = document.getElementById('blend-slider');
        const sliderValue = document.getElementById('slider-value');
        const enhanceBtn = document.getElementById('enhance-btn');
        const statusText = document.getElementById('status');
        const originalPreview = document.getElementById('original-preview');
        const enhancedOutput = document.getElementById('enhanced-output');

        // Update slider text in real-time
        blendSlider.addEventListener('input', (e) => {
            sliderValue.textContent = e.target.value;
        });

        // Show local preview immediately upon file selection
        imageInput.addEventListener('change', () => {
            const file = imageInput.files[0];
            if (file) {
                originalPreview.src = URL.createObjectURL(file);
                originalPreview.style.display = 'block';
                enhancedOutput.style.display = 'none'; // Reset output on new upload
                statusText.textContent = "";
            }
        });

        // Trigger API call to the backend
        enhanceBtn.addEventListener('click', async () => {
            if (imageInput.files.length === 0) {
                statusText.textContent = "Please upload an image first.";
                return;
            }

            const file = imageInput.files[0];
            const strength = parseFloat(blendSlider.value);

            try {
                enhanceBtn.disabled = true;
                statusText.textContent = "Connecting to backend GPU... Please wait.";

                // *** REPLACE THIS URL WITH YOUR ACTIVE LOCALTUNNEL LINK ***
                const backendURL = " https://tame-planets-spend.loca.lt";
                
                const app = await client(backendURL);
                statusText.textContent = "Processing image...";

                // Send the file and slider value to the Python enhance() function
                const result = await app.predict("/predict", [file, strength]);

                // Display the returned URL
                enhancedOutput.src = result.data[0].url;
                enhancedOutput.style.display = 'block';
                statusText.textContent = "Success!";
                statusText.style.color = "#4ade80"; // Green success text
                
            } catch (error) {
                console.error("Backend Error:", error);
                statusText.textContent = "Failed to connect. Ensure app.py and Localtunnel are running.";
                statusText.style.color = "#ef4444"; // Red error text
            } finally {
                enhanceBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
